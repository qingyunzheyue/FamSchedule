<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash 启动页 · FamSchedule 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --color-primary: #DC5A24;
  --color-background: #F4ECDC;
  --color-surface: #FFF9F0;
  --color-text-primary: #3A2E20;
  --color-text-secondary: #7A6E5D;
  --color-text-tertiary: #A89B86;
  --color-border: #E8DFD0;
  --color-success: #5C9D7E;
  --color-success-bg: #E8F0EA;
  --color-success-text: #2E5945;
  --color-warning: #E0A341;
  --color-warning-bg: #FBF1DC;
  --color-warning-text: #7A5615;
  --color-error: #C95444;
  --color-error-bg: #FBEAE7;
  --color-error-text: #7A2E25;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 20px;
  --shadow-1: 0 1px 2px rgba(58,46,32,0.06), 0 1px 3px rgba(58,46,32,0.04);
  --shadow-2: 0 2px 4px rgba(58,46,32,0.08), 0 4px 8px rgba(58,46,32,0.04);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #E5DCC5;
  color: var(--color-text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
}
.toolbar {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: #fff; padding: 12px 20px; border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1); margin-bottom: 20px; max-width: 1320px; width: 100%;
}
.toolbar h1 { font-size: 15px; font-weight: 600; margin: 0 12px 0 0; }
.toolbar .group { display: flex; gap: 6px; align-items: center; }
.toolbar label { font-size: 12px; color: var(--color-text-secondary); margin-right: 4px; }
.toolbar button {
  padding: 6px 12px; font-size: 12px; font-weight: 500;
  background: var(--color-surface); color: var(--color-text-primary);
  border: 1px solid var(--color-border); border-radius: 8px;
  cursor: pointer; transition: all 0.15s;
}
.toolbar button:hover { background: var(--color-background); }
.toolbar button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

.phone {
  background: var(--color-background);
  border-radius: 32px;
  box-shadow: 0 24px 48px -12px rgba(58,46,32,0.25);
  overflow: hidden;
  position: relative;
  transition: width 0.3s, height 0.3s;
  width: 375px; height: 812px;
}
.phone.mobile { width: 375px; height: 812px; }
.phone.tablet { width: 768px; height: 1024px; }
.phone.desktop { width: 1280px; height: 800px; }
.phone.dark { --color-background: #1A1814; --color-surface: #25221D; --color-text-primary: #F4ECDC; --color-text-secondary: #A89B86; --color-text-tertiary: #6E6452; --color-border: #3A332B; }
.status-bar { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; font-weight: 600; color: var(--color-text-primary); }
.variant { display: none; width: 100%; height: 100%; }
.variant.active { display: flex; flex-direction: column; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
</style>
</head>
<body>

<div class="toolbar">
  <h1>📱 Splash · 启动页</h1>
  <div class="group">
    <label>状态:</label>
    <button class="state-btn active" data-state="default">default</button>
    <button class="state-btn" data-state="loading">loading</button>
    <button class="state-btn" data-state="error">error</button>
  </div>
  <div class="group">
    <label>视口:</label>
    <button class="vp-btn active" data-vp="mobile">📱 375</button>
    <button class="vp-btn" data-vp="tablet">📱 768</button>
    <button class="vp-btn" data-vp="desktop">🖥 1280</button>
  </div>
  <div class="group">
    <label>主题:</label>
    <button class="theme-btn active" data-theme="light">☀ 亮</button>
    <button class="theme-btn" data-theme="dark">🌙 暗</button>
  </div>
</div>

<div class="phone mobile light" id="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 📡 🔋</span>
  </div>

  <!-- Variant: default -->
  <section class="variant active" data-state="default" style="justify-content: center; align-items: center;">
    <div style="text-align: center; animation: fadeIn 0.6s ease-out;">
      <div style="width: 96px; height: 96px; margin: 0 auto 24px; background: var(--color-primary); border-radius: 22px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-2);">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
          <path d="M32 12 L48 26 L48 50 L36 50 L36 38 L28 38 L28 50 L16 50 L16 26 Z" fill="#FFF9F0"/>
          <rect x="42" y="14" width="14" height="14" rx="2" fill="#FFF9F0" opacity="0.9"/>
          <text x="49" y="25" font-family="serif" font-size="10" font-weight="700" fill="#DC5A24" text-anchor="middle">12</text>
        </svg>
      </div>
      <h1 style="font-size: 22px; font-weight: 600; color: var(--color-text-primary); margin: 0 0 6px;">FamSchedule</h1>
      <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0;">家里的小日程</p>
    </div>
  </section>

  <!-- Variant: loading -->
  <section class="variant" data-state="loading" style="justify-content: center; align-items: center;">
    <div style="text-align: center;">
      <div style="width: 96px; height: 96px; margin: 0 auto 24px; background: var(--color-primary); border-radius: 22px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-2); animation: pulse 1.5s ease-in-out infinite;">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
          <path d="M32 12 L48 26 L48 50 L36 50 L36 38 L28 38 L28 50 L16 50 L16 26 Z" fill="#FFF9F0"/>
          <rect x="42" y="14" width="14" height="14" rx="2" fill="#FFF9F0" opacity="0.9"/>
        </svg>
      </div>
      <h1 style="font-size: 22px; font-weight: 600; margin: 0 0 6px;">FamSchedule</h1>
      <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 24px;">连接中...</p>
      <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
  </section>

  <!-- Variant: error -->
  <section class="variant" data-state="error" style="justify-content: center; align-items: center; padding: 24px;">
    <div style="text-align: center; max-width: 320px;">
      <div style="width: 64px; height: 64px; margin: 0 auto 20px; background: var(--color-error-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <h2 style="font-size: 20px; font-weight: 600; margin: 0 0 8px;">无法连接到服务器</h2>
      <p style="font-size: 14px; color: var(--color-text-secondary); margin: 0 0 24px;">请检查网络后重试</p>
      <button style="padding: 14px 32px; font-size: 15px; font-weight: 500; background: var(--color-primary); color: #fff; border: none; border-radius: 10px; cursor: pointer; width: 100%;">重试</button>
    </div>
  </section>

</div>

<script>
const phone = document.getElementById('phone');
document.querySelectorAll('.state-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
    document.querySelector(`.variant[data-state="${btn.dataset.state}"]`).classList.add('active');
  });
});
document.querySelectorAll('.vp-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    phone.classList.remove('mobile', 'tablet', 'desktop');
    phone.classList.add(btn.dataset.vp);
  });
});
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    phone.classList.remove('light', 'dark');
    phone.classList.add(btn.dataset.theme);
  });
});
</script>
</body>
</html>
